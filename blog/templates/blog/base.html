{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tommy's Blog</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lobster&subset=latin,latin-ext"
    />
    <!-- Django template syntax is used to serve static assets which location may vary during production -->
    <link rel="stylesheet" href="{% static 'css/blog.css' %}" />
  </head>
  <header class="page-header">
    <div class="container">
      {% if user.is_authenticated %}
        <a href="{% url 'post_new' %}" class="top-menu">
          {% include './icons/file-earmark-plus.svg' %}
        </a>
      {% endif %}
      <h1><a href="/">Tommy's Blog</a></h1>
    </div>
  </header>
  <body>
    <main class="container">
      <div class="row">
        <div class="col">{% block content %} {% endblock %}</div>
      </div>
    </main>
  </body>
</html>
